# The public Portal Meter seller on Cloudflare Workers.
#   npx wrangler@4.151.1 deploy                      (from this directory, credentials from the environment)
#   npx wrangler@4.151.1 secret put PROVIDER_KEY     (testnet key of the hosted provider, read from stdin)
#   npx wrangler@4.151.1 secret put ADMIN_TOKEN      (optional: lets the owner force a settlement)
name = "portal-meter"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
CHAIN_ID = "420420777"
EVM_RPC = "https://test-evm-rpc-v3.portaldot.dev"
SUB_RPC = "https://test-node-v3.portaldot.dev"
PUBLIC_URL = "https://portal-meter.swiftbotlab.workers.dev"
SESSION_CONTRACT = "0xCc2aBc8AC1B5676e8f9678bb5B6881A0b743B3d5"
SETTLEMENT = "0x9E7Ad2Aa754A0EBA70CFbd1db01d25ef97e5781e"
REGISTRY = "5DHgN8JZRpyo9mDaG1BSNh224AZXcQw8p3Y8GZK1K2Vd8Ku4"
REGISTRY_ACCOUNT = "0x3621669d774ff38e377992f276b1e320fd9836aad3581f688e4c7b8a1abf35d7"
ENDPOINT_ID = "3"
TOKEN = "0x00001e6100000000000000000000000000010000"
TOKEN_SYMBOL = "pUSD"
DECIMALS = "6"
PRICE = "10000"
