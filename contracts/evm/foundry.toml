[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
offline = true
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 100
fail_on_revert = false

[lint]
lint_on_build = false
