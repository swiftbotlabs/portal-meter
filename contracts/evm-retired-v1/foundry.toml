# Retired first deployment of MeterSession, kept so its on-chain code can be checked against source.
# Same compiler settings as contracts/evm.
[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
offline = true
bytecode_hash = "none"
cbor_metadata = false
